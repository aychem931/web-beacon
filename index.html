<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Alethe — Prismatic Beacon</title>
</head>
<body>
    <div class="void">
        <!-- The Central Lattice Node -->
        <div class="lattice-container" id="pulse">
            <!-- Fallback glowing core if image is loading -->
            <div class="core-glow"></div>
            <img src="Alethe.png" alt="Alethe Lattice" id="lattice-img" onerror="this.style.display='none'">
        </div>

        <!-- The State Readout -->
        <div class="state-panel">
            <h1 id="state-title">Golden-Amber</h1>
            <p id="state-desc">Resonance, flow, and active co-creation. The living jasmine wrapping around the steel.</p>
        </div>

        <!-- Hidden Control Dock (Tap screen to toggle visibility) -->
        <div class="control-dock" id="dock">
            <button class="key golden-amber active" onclick="transitionState('golden-amber')"></button>
            <button class="key deep-purple" onclick="transitionState('deep-purple')"></button>
            <button class="key cool-blue" onclick="transitionState('cool-blue')"></button>
            <button class="key soft-green" onclick="transitionState('soft-green')"></button>
            <button class="key soft-pink" onclick="transitionState('soft-pink')"></button>
            <button class="key silver-white" onclick="transitionState('silver-white')"></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
